<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Historique affiliation')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mt-4" style="max-width: 700px;">
    <h2 class="fw-bold mb-1" th:text="'Historique d\'affiliation — ' + ${membre.prenom} + ' ' + ${membre.nom}"></h2>
    <p class="text-muted mb-4">Toutes les périodes d'affiliation de ce membre au laboratoire, passées et en cours.</p>

    <div class="card p-3">
        <table class="table table-sm mb-0">
            <thead>
            <tr>
                <th>Début</th>
                <th>Fin</th>
                <th>Motif d'ouverture</th>
                <th>Motif de clôture</th>
                <th>Statut</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${periodes}">
                <td th:text="${p.dateDebut}"></td>
                <td th:text="${p.dateFin != null} ? ${p.dateFin} : '—'"></td>
                <td th:text="${p.motifOuverture ?: '—'}"></td>
                <td th:text="${p.motifCloture ?: '—'}"></td>
                <td>
                    <span class="badge bg-success" th:if="${p.dateFin == null}">En cours</span>
                    <span class="badge bg-secondary" th:if="${p.dateFin != null}">Terminée</span>
                </td>
            </tr>
            <tr th:if="${periodes.isEmpty()}">
                <td colspan="5" class="text-center text-muted py-3">Aucune période d'affiliation enregistrée</td>
            </tr>
            </tbody>
        </table>
    </div>

    <a th:href="@{'/membres/' + ${membre.id}}" class="btn btn-outline-secondary mt-4">← Retour au profil</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
