<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Membres')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-dark">👥 Membres du laboratoire</h2>
        <a href="/membres/ajouter" class="btn btn-primary">
            <i class="fa-solid fa-plus"></i> Ajouter un membre
        </a>
    </div>

    <div class="card p-3">
        <table class="table table-hover align-middle mb-0">
            <thead>
                <tr>
                    <th>Nom</th>
                    <th>Prénom</th>
                    <th>Email</th>
                    <th>Statut</th>
                    <th>Compte</th>
                    <th class="text-end">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="membre : ${membres}">
                    <td th:text="${membre.nom}"></td>
                    <td th:text="${membre.prenom}"></td>
                    <td th:text="${membre.email}"></td>
                    <td><span class="badge bg-info text-dark" th:text="${membre.statut}"></span></td>
                    <td>
                        <span th:if="${membre.actif}" class="badge bg-success">Actif</span>
                        <span th:unless="${membre.actif}" class="badge bg-secondary">Désactivé</span>
                    </td>
                    <td class="text-end">
                        <div class="d-flex gap-1 justify-content-end flex-wrap">
                            <a th:href="@{/membres/{id}(id=${membre.id})}" class="btn btn-sm btn-outline-primary" title="Voir le profil">
                                <i class="fa-solid fa-eye"></i>
                            </a>
                            <a th:href="@{/membres/modifier/{id}(id=${membre.id})}" class="btn btn-sm btn-outline-secondary" title="Modifier">
                                <i class="fa-solid fa-pen"></i>
                            </a>
                            <a th:href="@{/membres/{id}/historique(id=${membre.id})}" class="btn btn-sm btn-outline-secondary" title="Historique d'affiliation">
                                <i class="fa-solid fa-clock-rotate-left"></i>
                            </a>

                            <!-- Actions de gouvernance réservées au Directeur (§5.2) -->
                            <div sec:authorize="hasRole('DIRECTEUR')" class="d-flex gap-1">
                                <form th:if="${membre.actif} and ${membre.statut.name() != 'RETRAITE'} and ${membre.statut.name() != 'ANCIEN'}"
                                      th:action="@{/membres/retraite/{id}(id=${membre.id})}" method="post">
                                    <button type="submit" class="btn btn-sm btn-outline-warning" title="Mettre en retraite"
                                            onclick="return confirm('Mettre ce membre en retraite ? Son compte sera gelé.')">
                                        <i class="fa-solid fa-user-clock"></i>
                                    </button>
                                </form>

                                <form th:if="${membre.actif}" th:action="@{/membres/desactiver/{id}(id=${membre.id})}" method="post">
                                    <button type="submit" class="btn btn-sm btn-outline-danger" title="Désactiver"
                                            onclick="return confirm('Désactiver ce membre ? Son historique sera conservé.')">
                                        <i class="fa-solid fa-user-slash"></i>
                                    </button>
                                </form>

                                <form th:unless="${membre.actif}" th:action="@{/membres/reactiver/{id}(id=${membre.id})}" method="post" class="d-flex gap-1">
                                    <select name="nouveauStatut" class="form-select form-select-sm" style="width:110px">
                                        <option value="PERMANENT">Permanent</option>
                                        <option value="ASSOCIE">Associé</option>
                                        <option value="DOCTORANT">Doctorant</option>
                                    </select>
                                    <button type="submit" class="btn btn-sm btn-outline-success" title="Réactiver">
                                        <i class="fa-solid fa-rotate-left"></i>
                                    </button>
                                </form>
                            </div>
                        </div>
                    </td>
                </tr>
                <tr th:if="${membres.isEmpty()}">
                    <td colspan="6" class="text-center text-muted py-4">Aucun membre pour le moment</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<footer class="text-center mt-5 mb-3">
    Application LIAS Lab — Master Data Science & Big Data — FSBM Casablanca
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
