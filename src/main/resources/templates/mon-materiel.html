<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Mon matériel')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<div class="container mt-4" style="max-width: 800px;">
    <h2 class="fw-bold mb-4">📦 Mon matériel</h2>

    <div class="card p-3">
        <table class="table align-middle mb-0">
            <thead>
                <tr>
                    <th>Matériel</th>
                    <th>Quantité reçue</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="d : ${distributions}">
                    <td th:text="${d.materiel.nom}"></td>
                    <td th:text="${d.quantite}"></td>
                    <td th:text="${d.dateDistribution}"></td>
                </tr>
                <tr th:if="${distributions.isEmpty()}">
                    <td colspan="3" class="text-center text-muted py-4">Vous n'avez encore reçu aucun matériel</td>
                </tr>
            </tbody>
        </table>
    </div>

    <p class="text-muted mt-3" th:if="${!distributions.isEmpty()}"
       th:text="'Total reçu : ' + ${totalRecu} + ' unité(s)'"></p>

    <div class="d-flex gap-2 mt-4">
        <a href="/dashboard" class="btn btn-outline-secondary">← Tableau de bord</a>
        <a href="/demandes-materiel/mes-demandes" class="btn btn-outline-secondary">Mes demandes</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
