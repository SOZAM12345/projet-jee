<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Documents')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-dark">🗂️ Archivage documentaire</h2>
        <a href="/documents/ajouter" class="btn btn-primary">
            <i class="fa-solid fa-upload"></i> Ajouter un document
        </a>
    </div>

    <form th:action="@{/documents}" method="get" class="mb-4 d-flex gap-2" style="max-width: 400px;">
        <input type="text" name="q" class="form-control" placeholder="Rechercher par titre..." th:value="${q}"/>
        <button type="submit" class="btn btn-outline-secondary">
            <i class="fa-solid fa-magnifying-glass"></i>
        </button>
    </form>

    <div class="card p-3 mb-4">
        <table class="table table-hover align-middle mb-0">
            <thead>
                <tr>
                    <th>Titre</th>
                    <th>Type</th>
                    <th>Événement</th>
                    <th>Déposé par</th>
                    <th>Date</th>
                    <th class="text-end">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="doc : ${documentsActifs}">
                    <td th:text="${doc.titre}"></td>
                    <td><span class="badge bg-secondary" th:text="${doc.type}"></span></td>
                    <td th:text="${doc.evenement != null ? doc.evenement.titre : '—'}"></td>
                    <td th:text="${doc.uploader != null ? doc.uploader.nom + ' ' + doc.uploader.prenom : '—'}"></td>
                    <td th:text="${#temporals.format(doc.dateUpload, 'dd/MM/yyyy')}"></td>
                    <td class="text-end">
                        <a th:href="@{/documents/telecharger/{id}(id=${doc.id})}" class="btn btn-sm btn-outline-primary">
                            <i class="fa-solid fa-download"></i>
                        </a>
                        <form th:action="@{/documents/archiver/{id}(id=${doc.id})}" method="post" style="display:inline">
                            <button type="submit" class="btn btn-sm btn-outline-danger"
                                    onclick="return confirm('Archiver ce document ?')">
                                <i class="fa-solid fa-box-archive"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${documentsActifs.isEmpty()}">
                    <td colspan="6" class="text-center text-muted py-4">Aucun document trouvé</td>
                </tr>
            </tbody>
        </table>
    </div>

    <h4 class="fw-bold">📦 Archivés</h4>
    <div class="card p-3">
        <table class="table table-sm align-middle mb-0">
            <thead>
                <tr><th>Titre</th><th>Type</th><th>Date</th><th class="text-end">Actions</th></tr>
            </thead>
            <tbody>
                <tr th:each="doc : ${documentsArchives}">
                    <td th:text="${doc.titre}"></td>
                    <td><span class="badge bg-secondary" th:text="${doc.type}"></span></td>
                    <td th:text="${#temporals.format(doc.dateUpload, 'dd/MM/yyyy')}"></td>
                    <td class="text-end">
                        <form th:action="@{/documents/desarchiver/{id}(id=${doc.id})}" method="post">
                            <button type="submit" class="btn btn-sm btn-outline-success">
                                <i class="fa-solid fa-rotate-left"></i> Restaurer
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${documentsArchives.isEmpty()}">
                    <td colspan="4" class="text-center text-muted py-3">Aucun document archivé</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
