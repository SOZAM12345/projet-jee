<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ajouter une equipe')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mt-4" style="max-width: 650px;">
    <h2 class="fw-bold mb-4">➕ Ajouter une équipe</h2>

    <div class="card p-4">
        <form th:action="@{/equipes/enregistrer}" th:object="${equipe}" method="post">

            <div class="mb-3">
                <label class="form-label">Nom de l'équipe</label>
                <input type="text" class="form-control" th:field="*{nom}" required/>
            </div>

            <div class="mb-4">
                <label class="form-label">Description</label>
                <textarea class="form-control" rows="4" th:field="*{description}"></textarea>
            </div>

            <div class="d-flex justify-content-between">
                <a href="/equipes" class="btn btn-outline-secondary">← Annuler</a>
                <button type="submit" class="btn btn-primary px-4">
                    <i class="fa-solid fa-floppy-disk"></i> Enregistrer
                </button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
