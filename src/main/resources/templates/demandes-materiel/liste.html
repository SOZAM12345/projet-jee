<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Demandes de matériel')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-dark">🧾 Demandes de matériel en attente</h2>
        <div class="d-flex gap-2">
            <a href="/demandes-materiel/historique" class="btn btn-outline-secondary">
                <i class="fa-solid fa-clock-rotate-left"></i> Historique
            </a>
            <a href="/demandes-materiel/mes-demandes" class="btn btn-outline-secondary">Mes demandes</a>
            <a href="/demandes-materiel/soumettre" class="btn btn-primary">
                <i class="fa-solid fa-plus"></i> Nouvelle demande
            </a>
        </div>
    </div>

    <div class="card p-3">
        <table class="table table-hover align-middle mb-0">
            <thead>
                <tr>
                    <th>Demandeur</th>
                    <th>Désignation</th>
                    <th>Quantité</th>
                    <th>Motif</th>
                    <th>Soumise le</th>
                    <th class="text-end">Décision</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="d : ${demandes}">
                    <td th:text="${d.demandeur.prenom} + ' ' + ${d.demandeur.nom}"></td>
                    <td th:text="${d.designation}"></td>
                    <td th:text="${d.quantiteSouhaitee}"></td>
                    <td th:text="${d.motif}"></td>
                    <td th:text="${#temporals.format(d.dateSoumission, 'dd/MM/yyyy HH:mm')}"></td>
                    <td class="text-end">
                        <div sec:authorize="hasRole('DIRECTEUR')" class="d-flex gap-2 justify-content-end">
                            <form th:action="@{/demandes-materiel/valider/{id}(id=${d.id})}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-outline-success">Valider</button>
                            </form>
                            <form th:action="@{/demandes-materiel/refuser/{id}(id=${d.id})}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Refuser</button>
                            </form>
                        </div>
                        <span sec:authorize="!hasRole('DIRECTEUR')" class="text-muted">En attente de décision</span>
                    </td>
                </tr>
                <tr th:if="${demandes.isEmpty()}">
                    <td colspan="6" class="text-center text-muted py-4">Aucune demande en attente</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
