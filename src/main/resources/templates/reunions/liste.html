<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Réunions')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">🗓️ Réunions &amp; procès-verbaux</h2>
        <a href="/reunions/ajouter" class="btn btn-primary">
            <i class="fa-solid fa-plus"></i> Nouvelle réunion
        </a>
    </div>

    <div class="card p-3 mb-4">
        <h5 class="fw-bold mb-3">Réunions actives</h5>
        <table class="table table-hover align-middle mb-0">
            <thead>
            <tr>
                <th>Titre</th>
                <th>Date</th>
                <th>Équipe</th>
                <th>PV</th>
                <th class="text-end">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${reunionsActives}">
                <td><a th:href="@{/reunions/{id}(id=${r.id})}" th:text="${r.titre}"></a></td>
                <td th:text="${r.dateReunion}"></td>
                <td th:text="${r.equipe != null} ? ${r.equipe.nom} : 'Générale'"></td>
                <td>
                    <span class="badge bg-success" th:if="${r.cheminPv != null}">Disponible</span>
                    <span class="badge bg-secondary" th:if="${r.cheminPv == null}">En attente</span>
                </td>
                <td class="text-end">
                    <div class="d-flex gap-1 justify-content-end">
                        <a th:href="@{/reunions/{id}(id=${r.id})}" class="btn btn-sm btn-outline-primary">Voir</a>
                        <form th:action="@{/reunions/archiver/{id}(id=${r.id})}" method="post">
                            <button type="submit" class="btn btn-sm btn-outline-danger"
                                    onclick="return confirm('Archiver cette réunion ?')">
                                <i class="fa-solid fa-box-archive"></i>
                            </button>
                        </form>
                    </div>
                </td>
            </tr>
            <tr th:if="${reunionsActives.isEmpty()}">
                <td colspan="5" class="text-center text-muted py-3">Aucune réunion pour le moment</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="card p-3" th:if="${!reunionsArchivees.isEmpty()}">
        <h5 class="fw-bold mb-3 text-muted">Réunions archivées</h5>
        <table class="table table-sm mb-0">
            <thead>
            <tr><th>Titre</th><th>Date</th><th class="text-end">Actions</th></tr>
            </thead>
            <tbody>
            <tr th:each="r : ${reunionsArchivees}">
                <td th:text="${r.titre}"></td>
                <td th:text="${r.dateReunion}"></td>
                <td class="text-end">
                    <form th:action="@{/reunions/desarchiver/{id}(id=${r.id})}" method="post">
                        <button type="submit" class="btn btn-sm btn-outline-success">Restaurer</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
