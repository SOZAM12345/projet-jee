<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${titre})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mt-4" style="max-width:750px;">
    <h2 class="fw-bold mb-4" th:text="${titre}">Discussion</h2>

    <div class="mb-4" style="max-height:500px; overflow-y:auto;">
        <div th:if="${messages.isEmpty()}" class="text-muted text-center py-4">
            Aucun message pour l'instant. Soyez le premier à écrire !
        </div>
        <div class="card p-3 mb-2" th:each="m : ${messages}">
            <div class="d-flex justify-content-between">
                <strong th:text="${m.auteur.prenom} + ' ' + ${m.auteur.nom}"></strong>
                <small class="text-muted" th:text="${#temporals.format(m.dateEnvoi, 'dd/MM/yyyy HH:mm')}"></small>
            </div>
            <p class="mb-0 mt-1" th:text="${m.contenu}"></p>
        </div>
    </div>

    <form th:action="${actionUrl}" method="post" class="d-flex gap-2">
        <textarea name="contenu" class="form-control" rows="2" placeholder="Écrire un message..." required></textarea>
        <button type="submit" class="btn btn-primary align-self-end">Envoyer</button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
