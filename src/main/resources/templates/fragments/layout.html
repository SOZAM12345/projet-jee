<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(titre)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titre} + ' — LIAS'">LIAS</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/logo-lias.svg}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root{
            --ink:#1B3A63; --ink-soft:#4B5D71; --ink-faint:#8B97A6;
            --paper:#F4F6F8; --surface:#FFFFFF; --line:#E2E6EA;
            --brass:#3D6DA8; --brass-dark:#2A4F80; --brass-tint:#E8EEF5;
            --clay:#64748B; --clay-tint:#EEF1F5;
            --teal:#2F6F6B; --teal-tint:#E1EDEC;
        }
        body{ background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; }
        h1,h2,h3,.serif,.display{ font-family:'Plus Jakarta Sans',sans-serif; color:var(--ink); font-weight:700; letter-spacing:-0.01em; }

        .card{
            border:1px solid var(--line);
            border-radius:14px;
            box-shadow:0 2px 4px rgba(27,58,99,.08), 0 12px 28px rgba(27,58,99,.12);
            transition:transform .2s ease, box-shadow .2s ease;
        }
        .card:hover{
            transform:translateY(-6px) scale(1.015);
            box-shadow:0 6px 12px rgba(27,58,99,.12), 0 22px 40px rgba(27,58,99,.18);
        }
        .icon-tile{
            width:46px; height:46px; border-radius:12px;
            display:flex; align-items:center; justify-content:center;
            margin-bottom:1rem;
            box-shadow:0 4px 10px rgba(0,0,0,.12);
            transition:transform .2s ease;
        }
        .card:hover .icon-tile{ transform:scale(1.08) rotate(-3deg); }

        .table thead{ background-color:var(--ink); color:#fff; }
        .table thead th{ font-weight:600; font-size:.85rem; }
        .btn-primary{ background-color:var(--ink); border-color:var(--ink); border-radius:9px; font-weight:600; }
        .btn-primary:hover{ background-color:#122A49; border-color:#122A49; }
        footer{ color:#888; font-size:.85rem; }

        .site-header{ background:#fff; border-bottom:1px solid var(--line); }
        .site-header__inner{ display:flex; align-items:center; justify-content:space-between; padding:1rem 0; flex-wrap:wrap; gap:1rem; }
        .wordmark{ display:flex; align-items:center; gap:.75rem; text-decoration:none; }
        .wordmark svg{ height:44px; width:44px; border-radius:10px; box-shadow:0 2px 6px rgba(27,58,99,.25); }
        .wordmark__text{ display:flex; flex-direction:column; line-height:1; }
        .wordmark__mark{ font-family:'Plus Jakarta Sans',sans-serif; font-size:1.4rem; font-weight:800; color:var(--ink); }
        .wordmark__sub{ font-size:.68rem; color:var(--ink-faint); margin-top:.25rem; font-weight:500; }
        .site-nav{ display:flex; align-items:center; gap:1.4rem; flex-wrap:wrap; }
        .site-nav a{ color:var(--ink); text-decoration:none; font-size:.9rem; font-weight:600; display:inline-flex; align-items:center; gap:.35rem; padding:.3rem 0; border-bottom:2px solid transparent; }
        .site-nav a:hover{ color:var(--brass); border-bottom-color:var(--brass); }
        .site-nav__meta{ display:flex; align-items:center; gap:.85rem; }
        .site-nav__user{ font-size:.85rem; color:var(--ink-soft); font-weight:500; }
        .site-nav .badge{ font-size:.68rem; padding:.28em .5em; line-height:1; background:var(--brass) !important; }

        .btn-ink,.btn-outline-ink,.btn-brass{
            border-radius:9px; padding:.65rem 1.4rem; font-size:.92rem; font-weight:600;
            text-decoration:none; display:inline-block; border:1px solid transparent; cursor:pointer;
            transition:transform .15s ease, box-shadow .15s ease;
        }
        .btn-ink{ background:var(--ink); color:#fff; border-color:var(--ink); box-shadow:0 2px 6px rgba(27,58,99,.25); }
        .btn-ink:hover{ background:#122A49; color:#fff; transform:translateY(-2px); box-shadow:0 6px 14px rgba(27,58,99,.3); }
        .btn-ink:active{ transform:translateY(0); box-shadow:0 1px 3px rgba(27,58,99,.25); }

        .btn-brass{ background:var(--brass); color:#fff; border-color:var(--brass); box-shadow:0 2px 6px rgba(61,109,168,.3); }
        .btn-brass:hover{ background:var(--brass-dark); border-color:var(--brass-dark); color:#fff; transform:translateY(-2px); box-shadow:0 6px 14px rgba(61,109,168,.35); }
        .btn-brass:active{ transform:translateY(0); box-shadow:0 1px 3px rgba(61,109,168,.3); }

        .btn-outline-ink{ background:transparent; color:var(--ink); border-color:var(--ink); }
        .btn-outline-ink:hover{ background:var(--ink); color:#fff; transform:translateY(-2px); box-shadow:0 6px 14px rgba(27,58,99,.2); }
        .btn-outline-ink:active{ transform:translateY(0); box-shadow:none; }

        .site-nav__meta .btn-outline-ink{ color:var(--ink); border-color:var(--line); }
        .site-nav__meta .btn-outline-ink:hover{ background:var(--ink); color:#fff; border-color:var(--ink); }
        .btn-sm{ padding:.45rem 1rem; font-size:.85rem; }

        .panel{
            background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:2rem;
            box-shadow:0 1px 2px rgba(27,58,99,.05), 0 10px 28px rgba(27,58,99,.08);
        }

        .field{ margin-bottom:1.35rem; }
        .field label{ display:block; font-size:.85rem; color:var(--ink-soft); font-weight:600; margin-bottom:.4rem; }
        .field input,.field textarea,.field select{ width:100%; border:1px solid var(--line); border-radius:8px; padding:.65rem .8rem; font-family:inherit; font-size:.95rem; color:var(--ink); background:#fff; }
        .field input:focus,.field textarea:focus,.field select:focus{ outline:2px solid var(--brass); outline-offset:1px; border-color:var(--brass); }
        .form-section-title{ font-size:.85rem; color:var(--ink-faint); font-weight:600; margin:1.75rem 0 1rem; padding-bottom:.5rem; border-bottom:1px solid var(--line); }
        .form-section-title:first-of-type{ margin-top:0; }
        .form-actions{ display:flex; justify-content:space-between; margin-top:2rem; }

        .eyebrow{ font-size:.8rem; color:var(--brass-dark); font-weight:700; margin-bottom:.5rem; }
        .section-title{ font-size:1.1rem; color:var(--ink); margin-bottom:1rem; font-weight:700; }

        .hero{ padding:4rem 0 3rem; display:grid; grid-template-columns:1.5fr 1fr; gap:3rem; }
        .hero h1{ font-size:2.7rem; line-height:1.12; margin-bottom:1.25rem; }
        .hero .lead{ max-width:60ch; color:var(--ink-soft); font-size:1.05rem; line-height:1.65; margin-bottom:1.75rem; }
        @media (max-width:820px){ .hero{ grid-template-columns:1fr; } }

        .fact-list{ border-top:1px solid var(--line); margin:0; }
        .fact-row{ display:flex; justify-content:space-between; gap:1rem; padding:.85rem 0; border-bottom:1px solid var(--line); font-size:.9rem; }
        .fact-row dt{ color:var(--ink-faint); margin:0; }
        .fact-row dd{ margin:0; color:var(--ink); font-weight:600; text-align:right; }

        .toc{ border-top:1px solid var(--line); }
        .toc-row{ display:flex; justify-content:space-between; align-items:center; gap:1.5rem; padding:1.5rem 0; border-bottom:1px solid var(--line); flex-wrap:wrap; }
        .toc-row__title{ font-family:'Plus Jakarta Sans',sans-serif; font-size:1.25rem; font-weight:700; color:var(--ink); margin:0 0 .25rem; }
        .toc-row__desc{ color:var(--ink-soft); font-size:.92rem; margin:0; }
        .toc-row__link{ white-space:nowrap; color:var(--ink); font-weight:600; text-decoration:none; border-bottom:2px solid var(--brass); }
        .toc-row__link:hover{ color:var(--brass); }

        .tag{ display:inline-block; font-size:.75rem; padding:.3rem .7rem; border-radius:20px; font-weight:600; }
        .tag-ink{ background:var(--ink); color:#fff; }
        .tag-brass{ background:var(--brass-tint); color:var(--brass-dark); }
        .tag-teal{ background:var(--teal-tint); color:var(--teal); }
        .tag-clay{ background:var(--clay-tint); color:var(--clay); }

        .notice{ padding:.9rem 1.1rem; border-radius:10px; font-size:.9rem; margin-bottom:1.25rem; border:1px solid; }
        .notice-error{ background:var(--clay-tint); border-color:var(--clay); color:var(--clay); }
        .notice-success{ background:var(--teal-tint); border-color:var(--teal); color:var(--teal); }
        .notice-info{ background:var(--brass-tint); border-color:var(--brass); color:var(--brass-dark); }

        .auth-wrap{ display:flex; justify-content:center; padding:4rem 0; }
        .auth-card{ width:100%; max-width:420px; }
        .auth-links{ margin-top:1.75rem; padding-top:1.5rem; border-top:1px solid var(--line); font-size:.9rem; color:var(--ink-soft); text-align:center; }
        .auth-links a{ display:block; margin-top:.5rem; color:var(--ink); font-weight:600; }

        .page-narrow{ max-width:650px; margin:3rem auto; }
        a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible{ outline:2px solid var(--brass); outline-offset:2px; }
    </style>
</head>
<body>
<header class="site-header" th:fragment="navbar">
    <div class="container site-header__inner">
        <a class="wordmark" href="/">
            <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <rect width="200" height="200" rx="42" fill="#1B3A63"/>
                <path d="M62 54 L62 132 L146 132" stroke="#FFFFFF" stroke-width="20" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                <line x1="112" y1="66" x2="146" y2="88" stroke="#FFFFFF" stroke-width="4" opacity="0.55"/>
                <line x1="146" y1="88" x2="146" y2="132" stroke="#FFFFFF" stroke-width="4" opacity="0.35"/>
                <circle cx="112" cy="66" r="9" fill="#FFFFFF" opacity="0.6"/>
                <circle cx="146" cy="88" r="12" fill="#8B97A6"/>
            </svg>
            <span class="wordmark__text">
                <span class="wordmark__mark">LIAS</span>
                <span class="wordmark__sub">Laboratoire — FSBM Casablanca</span>
            </span>
        </a>
        <nav class="site-nav">
            <a href="/equipes" sec:authorize="!hasRole('ADMIN')">Équipes</a>

            <a href="/evenements" sec:authorize="!hasRole('ADMIN')">
                Événements
                <span th:if="${nbNotifEvenements > 0}" class="badge rounded-pill bg-danger" th:text="${nbNotifEvenements}"></span>
            </a>

            <a href="/calendrier" sec:authorize="!hasRole('ADMIN')">Calendrier</a>
            <a href="/publications" sec:authorize="!hasRole('ADMIN')">Publications</a>
            <a href="/membres" sec:authorize="hasAnyRole('PERMANENT','DIRECTEUR','VICE_DIRECTEUR','CHEF_EQUIPE','MEMBRE_EQUIPE')">Membres</a>

            <a href="/documents" sec:authorize="hasAnyRole('PERMANENT','DIRECTEUR','VICE_DIRECTEUR','CHEF_EQUIPE','MEMBRE_EQUIPE')">
                Documents
                <span th:if="${nbNotifDocuments > 0}" class="badge rounded-pill bg-danger" th:text="${nbNotifDocuments}"></span>
            </a>

            <a href="/reunions" sec:authorize="hasAnyRole('PERMANENT','DIRECTEUR','VICE_DIRECTEUR','CHEF_EQUIPE','MEMBRE_EQUIPE')">Réunions</a>
            <a href="/conventions" sec:authorize="hasAnyRole('PERMANENT','DIRECTEUR','VICE_DIRECTEUR','CHEF_EQUIPE','MEMBRE_EQUIPE')">Conventions</a>

            <a href="/materiel" sec:authorize="hasAnyRole('DIRECTEUR','VICE_DIRECTEUR')">Matériel</a>
            <a href="/materiel/mes-distributions" sec:authorize="hasAnyRole('PERMANENT','CHEF_EQUIPE','MEMBRE_EQUIPE')">
                Mon matériel
                <span th:if="${nbNotifMaterielRecu > 0}" class="badge rounded-pill bg-danger" th:text="${nbNotifMaterielRecu}"></span>
            </a>

            <a href="/demandes-materiel" sec:authorize="hasAnyRole('DIRECTEUR','VICE_DIRECTEUR')">Demandes matériel</a>
            <a href="/demandes-materiel/mes-demandes" sec:authorize="hasAnyRole('PERMANENT','CHEF_EQUIPE','MEMBRE_EQUIPE')">
                Mes demandes matériel
                <span th:if="${nbNotifValidationDemande > 0}" class="badge rounded-pill bg-danger" th:text="${nbNotifValidationDemande}"></span>
            </a>

            <a href="/mandats" sec:authorize="hasAnyRole('PERMANENT','DIRECTEUR','VICE_DIRECTEUR','CHEF_EQUIPE','MEMBRE_EQUIPE')">Mandats</a>
            <a href="/recherche" sec:authorize="hasAnyRole('PERMANENT','DIRECTEUR','VICE_DIRECTEUR','CHEF_EQUIPE','MEMBRE_EQUIPE','ASSOCIE')">Recherche</a>

            <a href="/discussions" sec:authorize="hasAnyRole('PERMANENT','DIRECTEUR','VICE_DIRECTEUR','CHEF_EQUIPE','MEMBRE_EQUIPE','ASSOCIE','ADMIN')">
                Discussions
                <span th:if="${nbMessagesNonLus > 0}" class="badge rounded-pill bg-danger" th:text="${nbMessagesNonLus}"></span>
            </a>

            <a href="/admin/comptes" sec:authorize="hasRole('ADMIN')">Administration</a>
            <a href="/dashboard" sec:authorize="isAuthenticated()">Tableau de bord</a>
            <span class="site-nav__meta">
                <a href="/login" sec:authorize="isAnonymous()" class="btn-outline-ink btn-sm">Se connecter</a>
                <span class="site-nav__user" sec:authorize="isAuthenticated()" sec:authentication="name"></span>
                <form th:action="@{/logout}" method="post" class="d-inline" sec:authorize="isAuthenticated()">
                    <button type="submit" class="btn-outline-ink btn-sm">Déconnexion</button>
                </form>
            </span>
        </nav>
    </div>
</header>
</body>
</html>
