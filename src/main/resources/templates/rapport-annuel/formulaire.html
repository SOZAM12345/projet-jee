<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Rapport annuel')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mt-4" style="max-width: 550px;">
    <h2 class="fw-bold mb-2">📊 Rapport d'activité annuel</h2>
    <p class="text-muted mb-4">
        Génère automatiquement le bilan des événements, publications, documents, réunions,
        conventions et demandes de matériel du laboratoire pour l'année sélectionnée.
    </p>

    <div class="card p-4">
        <form action="/rapport-annuel/generer" method="get">
            <div class="mb-4">
                <label class="form-label">Année</label>
                <select name="annee" class="form-select">
                    <option th:each="a : ${#numbers.sequence(anneeCourante + 1, anneeCourante - 4, -1)}"
                            th:value="${a}" th:text="${a}"
                            th:selected="${a == anneeCourante}"></option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary w-100">Générer le rapport</button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
