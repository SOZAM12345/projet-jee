<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Detail convention')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mt-4" style="max-width: 800px;">
    <h2 class="fw-bold mb-1" th:text="${convention.titre}"></h2>
    <p class="text-muted">
        Avec <a th:href="@{/partenaires/{id}(id=${convention.partenaire.id})}" th:text="${convention.partenaire.nom}"></a>
        — signée le <span th:text="${convention.dateSignature}"></span>
    </p>

    <div class="card p-4 mb-3">
        <h6 class="fw-bold">Objet</h6>
        <p th:text="${convention.objet}"></p>
    </div>

    <div class="card p-4 mb-3">
        <h6 class="fw-bold mb-2">Document de la convention</h6>
        <div th:if="${convention.cheminDocument != null}">
            <a th:href="@{/conventions/{id}/telecharger-document(id=${convention.id})}" class="btn btn-outline-primary">
                <i class="fa-solid fa-download"></i> Télécharger le document
            </a>
        </div>
        <div th:if="${convention.cheminDocument == null}">
            <p class="text-muted">Aucun document uploadé pour le moment.</p>
            <form th:action="@{/conventions/{id}/uploader-document(id=${convention.id})}" method="post" enctype="multipart/form-data" class="d-flex gap-2">
                <input type="file" name="document" class="form-control" required/>
                <button type="submit" class="btn btn-primary">
                    <i class="fa-solid fa-upload"></i> Uploader
                </button>
            </form>
        </div>
    </div>

    <div class="card p-4 mb-3">
        <h6 class="fw-bold mb-2">Activités associées</h6>
        <table class="table table-sm mb-3">
            <thead><tr><th>Description</th><th>Date</th></tr></thead>
            <tbody>
                <tr th:each="a : ${activites}">
                    <td th:text="${a.description}"></td>
                    <td th:text="${a.date}"></td>
                </tr>
                <tr th:if="${activites.isEmpty()}">
                    <td colspan="2" class="text-center text-muted py-3">Aucune activité enregistrée</td>
                </tr>
            </tbody>
        </table>

        <form th:action="@{/conventions/{id}/ajouter-activite(id=${convention.id})}" th:object="${activite}" method="post" class="d-flex gap-2">
            <input type="text" th:field="*{description}" class="form-control" placeholder="Description de l'activité" required/>
            <input type="date" th:field="*{date}" class="form-control" style="max-width:180px" required/>
            <button type="submit" class="btn btn-primary">
                <i class="fa-solid fa-plus"></i> Ajouter
            </button>
        </form>
    </div>

    <a href="/conventions" class="btn btn-outline-secondary">← Retour aux conventions</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
