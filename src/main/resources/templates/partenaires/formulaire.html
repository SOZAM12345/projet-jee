<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ajouter un partenaire')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mt-4" style="max-width: 650px;">
    <h2 class="fw-bold mb-4">🤝 Ajouter un partenaire</h2>

    <div class="card p-4">
        <form th:action="@{/partenaires/enregistrer}" th:object="${partenaire}" method="post">

            <div class="mb-3">
                <label class="form-label">Nom du partenaire</label>
                <input type="text" class="form-control" th:field="*{nom}" required/>
            </div>

            <div class="mb-3">
                <label class="form-label">Type d'organisme</label>
                <input type="text" class="form-control" th:field="*{typeOrganisme}" placeholder="Université, Entreprise, Organisme public..."/>
            </div>

            <div class="mb-3">
                <label class="form-label">Pays</label>
                <input type="text" class="form-control" th:field="*{pays}"/>
            </div>

            <div class="mb-3">
                <label class="form-label">Email de contact</label>
                <input type="email" class="form-control" th:field="*{contactEmail}"/>
            </div>

            <div class="mb-4">
                <label class="form-label">Description</label>
                <textarea class="form-control" rows="3" th:field="*{description}"></textarea>
            </div>

            <div class="d-flex justify-content-between">
                <a href="/partenaires" class="btn btn-outline-secondary">← Annuler</a>
                <button type="submit" class="btn btn-primary px-4">
                    <i class="fa-solid fa-floppy-disk"></i> Enregistrer
                </button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
