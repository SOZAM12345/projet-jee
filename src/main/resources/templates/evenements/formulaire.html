<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ajouter un evenement')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mt-4" style="max-width: 650px;">
    <h2 class="fw-bold mb-4">➕ Ajouter un événement</h2>

    <div class="card p-4">
        <form th:action="@{/evenements/enregistrer}" th:object="${evenement}" method="post">

            <div class="mb-3">
                <label class="form-label">Titre</label>
                <input type="text" class="form-control" th:field="*{titre}" required/>
                <div class="form-text">Utilise le même titre à chaque édition (ex: "Workshop IA") pour regrouper l'historique.</div>
            </div>

            <div class="mb-3">
                <label class="form-label">Édition</label>
                <input type="text" class="form-control" th:field="*{edition}" placeholder="ex: 2026, Édition 3..."/>
            </div>

            <div class="mb-3">
                <label class="form-label">Type</label>
                <select class="form-select" th:field="*{type}">
                    <option value="CONFERENCE">Conférence</option>
                    <option value="SEMINAIRE">Séminaire</option>
                    <option value="WORKSHOP">Workshop</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea class="form-control" rows="3" th:field="*{description}"></textarea>
            </div>

            <div class="row mb-3">
                <div class="col">
                    <label class="form-label">Date début</label>
                    <input type="date" class="form-control" th:field="*{dateDebut}"/>
                </div>
                <div class="col">
                    <label class="form-label">Date fin</label>
                    <input type="date" class="form-control" th:field="*{dateFin}"/>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Lieu</label>
                <input type="text" class="form-control" th:field="*{lieu}"/>
            </div>

            <div class="mb-4">
                <label class="form-label">Organisateurs</label>
                <select class="form-select" th:field="*{organisateurs}" multiple size="6">
                    <option th:each="m : ${membres}" th:value="${m.id}" th:text="${m.nom} + ' ' + ${m.prenom}"></option>
                </select>
                <div class="form-text">Maintiens Ctrl (ou Cmd) enfoncé pour sélectionner plusieurs membres.</div>
            </div>

            <div class="d-flex justify-content-between">
                <a href="/evenements" class="btn btn-outline-secondary">← Annuler</a>
                <button type="submit" class="btn btn-primary px-4">
                    <i class="fa-solid fa-floppy-disk"></i> Enregistrer
                </button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
