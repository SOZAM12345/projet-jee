<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Evenements')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-dark">📅 Événements scientifiques</h2>
        <a href="/evenements/ajouter" class="btn btn-primary"
           sec:authorize="hasAnyRole('PERMANENT','DIRECTEUR','VICE_DIRECTEUR','CHEF_EQUIPE','MEMBRE_EQUIPE')">
            <i class="fa-solid fa-plus"></i> Ajouter un événement
        </a>
    </div>

    <h4 class="fw-bold mt-4">À venir / actifs</h4>
    <div class="card p-3 mb-4">
        <table class="table table-hover align-middle mb-0">
            <thead>
                <tr>
                    <th>Titre</th>
                    <th>Édition</th>
                    <th>Type</th>
                    <th>Date début</th>
                    <th>Date fin</th>
                    <th>Lieu</th>
                    <th>Organisateurs</th>
                    <th class="text-end">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="evenement : ${evenementsActifs}">
                    <td><a th:href="@{/evenements/{id}(id=${evenement.id})}" th:text="${evenement.titre}"></a></td>
                    <td th:text="${evenement.edition ?: '—'}"></td>
                    <td><span class="badge bg-secondary" th:text="${evenement.type}"></span></td>
                    <td th:text="${evenement.dateDebut}"></td>
                    <td th:text="${evenement.dateFin}"></td>
                    <td th:text="${evenement.lieu}"></td>
                    <td>
                        <span th:each="org, iter : ${evenement.organisateurs}">
                            <span th:text="${org.nom} + ' ' + ${org.prenom}"></span><span th:if="${!iter.last}">, </span>
                        </span>
                        <span th:if="${evenement.organisateurs.isEmpty()}">—</span>
                    </td>
                    <td class="text-end">
                        <form th:action="@{/evenements/archiver/{id}(id=${evenement.id})}" method="post"
                              sec:authorize="hasAnyRole('PERMANENT','DIRECTEUR','VICE_DIRECTEUR','CHEF_EQUIPE','MEMBRE_EQUIPE')">
                            <button type="submit" class="btn btn-sm btn-outline-secondary"
                                    onclick="return confirm('Archiver cet événement ? Il restera consultable dans l\'historique.')">
                                <i class="fa-solid fa-box-archive"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${evenementsActifs.isEmpty()}">
                    <td colspan="8" class="text-center text-muted py-4">Aucun événement actif</td>
                </tr>
            </tbody>
        </table>
    </div>

    <h4 class="fw-bold">📦 Archivés</h4>
    <div class="card p-3 mb-4">
        <table class="table table-sm align-middle mb-0">
            <thead>
                <tr>
                    <th>Titre</th>
                    <th>Édition</th>
                    <th>Type</th>
                    <th>Date début</th>
                    <th class="text-end">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="evenement : ${evenementsArchives}">
                    <td><a th:href="@{/evenements/{id}(id=${evenement.id})}" th:text="${evenement.titre}"></a></td>
                    <td th:text="${evenement.edition ?: '—'}"></td>
                    <td><span class="badge bg-secondary" th:text="${evenement.type}"></span></td>
                    <td th:text="${evenement.dateDebut}"></td>
                    <td class="text-end">
                        <form th:action="@{/evenements/desarchiver/{id}(id=${evenement.id})}" method="post"
                              sec:authorize="hasAnyRole('PERMANENT','DIRECTEUR','VICE_DIRECTEUR','CHEF_EQUIPE','MEMBRE_EQUIPE')">
                            <button type="submit" class="btn btn-sm btn-outline-success">
                                <i class="fa-solid fa-rotate-left"></i> Restaurer
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${evenementsArchives.isEmpty()}">
                    <td colspan="5" class="text-center text-muted py-3">Aucun événement archivé</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
