<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Détail événement')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mt-4" style="max-width: 700px;">
    <h2 class="fw-bold mb-1" th:text="${evenement.titre} + (${evenement.edition} != null ? ' — ' + ${evenement.edition} : '')"></h2>
    <span class="badge bg-secondary" th:text="${evenement.type}"></span>
    <span th:if="${evenement.archive}" class="badge bg-dark">Archivé</span>

    <div class="card p-4 my-3">
        <p><strong>Description :</strong><br/><span th:text="${evenement.description ?: '—'}"></span></p>
        <p><strong>Dates :</strong> <span th:text="${evenement.dateDebut}"></span> → <span th:text="${evenement.dateFin}"></span></p>
        <p><strong>Lieu :</strong> <span th:text="${evenement.lieu ?: '—'}"></span></p>
        <p class="mb-0"><strong>Organisateurs :</strong>
            <span th:each="org, iter : ${evenement.organisateurs}">
                <span th:text="${org.nom} + ' ' + ${org.prenom}"></span><span th:if="${!iter.last}">, </span>
            </span>
            <span th:if="${evenement.organisateurs.isEmpty()}">—</span>
        </p>
    </div>

    <div class="card p-3 mb-4" sec:authorize="hasAnyRole('PERMANENT','DIRECTEUR','VICE_DIRECTEUR','CHEF_EQUIPE','MEMBRE_EQUIPE','ASSOCIE')">
        <h6 class="fw-bold mb-1">💬 Discussion de l'événement</h6>
        <p class="text-muted small mb-2">Échanges liés à l'organisation et au suivi de cet événement.</p>
        <a th:href="@{/discussions/evenement/{id}(id=${evenement.id})}" class="btn btn-outline-primary btn-sm">
            Ouvrir la discussion →
        </a>
    </div>

    <h5 class="fw-bold">Autres éditions de "<span th:text="${evenement.titre}"></span>"</h5>
    <div class="card p-3 mb-4">
        <table class="table table-sm mb-0">
            <thead><tr><th>Édition</th><th>Date début</th><th>Statut</th></tr></thead>
            <tbody>
                <tr th:each="e : ${autresEditions}">
                    <td><a th:href="@{/evenements/{id}(id=${e.id})}" th:text="${e.edition ?: '—'}"></a></td>
                    <td th:text="${e.dateDebut}"></td>
                    <td>
                        <span th:if="${e.archive}" class="badge bg-dark">Archivé</span>
                        <span th:unless="${e.archive}" class="badge bg-success">Actif</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <a href="/evenements" class="btn btn-outline-secondary">← Retour aux événements</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
