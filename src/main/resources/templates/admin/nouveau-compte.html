<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Administration — Nouveau compte')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mt-4" style="max-width: 650px;">
    <div th:replace="~{fragments/admin-nav :: nav('comptes')}"></div>

    <h2 class="fw-bold mb-4">➕ Créer un nouveau compte</h2>

    <div class="card p-4">
        <form th:action="@{/admin/comptes/nouveau}" th:object="${nouveauMembre}" method="post">

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Prénom</label>
                    <input type="text" class="form-control" th:field="*{prenom}" required/>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Nom</label>
                    <input type="text" class="form-control" th:field="*{nom}" required/>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" th:field="*{email}" required/>
            </div>

            <div class="mb-3">
                <label class="form-label">Mot de passe initial</label>
                <input type="text" class="form-control" th:field="*{motDePasse}" required/>
                <div class="form-text">Le membre pourra le changer, ou vous pourrez le réinitialiser plus tard.</div>
            </div>

            <div class="mb-3">
                <label class="form-label">Statut</label>
                <select class="form-select" th:field="*{statut}">
                    <option th:each="s : ${statuts}" th:value="${s}" th:text="${s}"></option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Équipe</label>
                <select class="form-select" th:field="*{equipe}">
                    <option value="">— Aucune —</option>
                    <option th:each="e : ${equipes}" th:value="${e.id}" th:text="${e.nom}"></option>
                </select>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Établissement d'origine</label>
                    <input type="text" class="form-control" th:field="*{etablissementOrigine}"/>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Laboratoire d'origine</label>
                    <input type="text" class="form-control" th:field="*{laboratoireOrigine}"/>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Biographie</label>
                <textarea class="form-control" rows="2" th:field="*{biographie}"></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Centres d'intérêt</label>
                <input type="text" class="form-control" th:field="*{centresInteret}"/>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Date de naissance</label>
                    <input type="date" class="form-control" th:field="*{dateNaissance}"/>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Date d'embauche</label>
                    <input type="date" class="form-control" th:field="*{dateEmbauche}"/>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Date d'affiliation</label>
                    <input type="date" class="form-control" th:field="*{dateAffiliation}"/>
                </div>
            </div>

            <div class="form-check mb-4">
                <input type="checkbox" class="form-check-input" th:field="*{administrateurSysteme}"/>
                <label class="form-check-label">Compte administrateur système (accès technique)</label>
            </div>

            <div class="d-flex gap-2">
                <a th:href="@{/admin/comptes}" class="btn btn-outline-secondary w-50">Annuler</a>
                <button type="submit" class="btn btn-primary w-50">Créer le compte</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
