<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Administration — Comptes')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mt-4">
    <div th:replace="~{fragments/admin-nav :: nav(${section})}"></div>

    <h2 class="fw-bold mb-4">⚙️ Comptes utilisateurs</h2>

    <div class="mb-3 text-end">
        <a th:href="@{/admin/comptes/nouveau}" class="btn btn-primary">➕ Créer un compte</a>
    </div>

    <div class="alert alert-warning" th:if="${motDePasseGenere != null}">
        <strong>Nouveau mot de passe généré :</strong>
        <code th:text="${motDePasseGenere}"></code>
        — communiquez-le au membre concerné, il ne sera plus affiché après cette page.
    </div>

    <div class="card p-3">
        <table class="table table-hover align-middle mb-0">
            <thead>
                <tr>
                    <th>Nom</th>
                    <th>Email</th>
                    <th>Statut</th>
                    <th>Compte</th>
                    <th class="text-end">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="m : ${membres}">
                    <td th:text="${m.prenom} + ' ' + ${m.nom}"></td>
                    <td th:text="${m.email}"></td>
                    <td><span class="badge bg-info text-dark" th:text="${m.statut}"></span></td>
                    <td>
                        <span th:if="${m.actif}" class="badge bg-success">Actif</span>
                        <span th:unless="${m.actif}" class="badge bg-secondary">Désactivé</span>
                    </td>
                    <td class="text-end">
                        <form th:action="@{/admin/comptes/{id}/reinitialiser(id=${m.id})}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-outline-warning"
                                    onclick="return confirm('Réinitialiser le mot de passe de ce compte ?')">
                                🔑 Réinitialiser le mot de passe
                            </button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
